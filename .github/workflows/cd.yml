name: CD - Deploy Staging e Produção

# develop -> STAGING (automático)      main -> PRODUÇÃO (com aprovação do Environment)
on:
  push:
    branches: [develop, main]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/esg-energy-api

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  build:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy STAGING
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Deploy no Azure Web App (staging)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_STAGING }}
          publish-profile: ${{ secrets.AZURE_PROFILE_STAGING }}
          images: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Smoke test (health check)
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 15 --retry-all-errors \
            "${{ steps.deploy.outputs.webapp-url }}/actuator/health"

  deploy-production:
    name: Deploy PRODUÇÃO
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production          # configure "Required reviewers" em Settings > Environments
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Deploy no Azure Web App (produção)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_PROD }}
          publish-profile: ${{ secrets.AZURE_PROFILE_PROD }}
          images: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Smoke test (health check)
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 15 --retry-all-errors \
            "${{ steps.deploy.outputs.webapp-url }}/actuator/health"
