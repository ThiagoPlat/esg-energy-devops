# Produção local (porta 8082):
#   API_PORT=8082 docker compose -p esg-prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  mongo:
    container_name: esg-mongo-prod
  api:
    container_name: esg-api-prod
    image: esg-energy-api:production
    environment:
      APP_ENV: production
