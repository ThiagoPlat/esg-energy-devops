spring.application.name=esg-energy-platform
server.port=8080

# Credenciais e URI SEMPRE por variavel de ambiente (nada de senha no codigo)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/esg_energy_db}
# Campos Java (camelCase) sao gravados em snake_case no Mongo, igual a atividade ESG
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy

# Identifica o ambiente (local | staging | production) no endpoint /api/info
app.environment=${APP_ENV:local}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
